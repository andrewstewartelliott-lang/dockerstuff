services:
  app:
    image: nginx:latest
    ports:
      - "8088:80"
    depends_on:
      - db

  app2:
    image: andrewstewartelliott/gin-info-api:latest
    ports:
      - "8080:8080"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: exampledb
      POSTGRES_USER: example
      POSTGRES_PASSWORD: examplepass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

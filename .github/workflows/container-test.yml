name: Container smoke test

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pull API container
        run: docker pull andrewstewartelliott/gin-info-api:latest

      - name: Start API container
        run: |
          docker run \
            --detach \
            --name gin-info-api \
            --publish 8080:8080 \
            andrewstewartelliott/gin-info-api:latest

      - name: Wait for /info endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --max-time 5 \
              http://127.0.0.1:8080/info; then
              echo
              echo "The /info endpoint is responding."
              exit 0
            fi

            echo "Waiting for the API to start... attempt ${attempt}/30"
            sleep 2
          done

          echo "The /info endpoint did not become ready."
          docker logs gin-info-api
          exit 1

      - name: Stop and remove container
        if: always()
        run: docker rm --force gin-info-api
